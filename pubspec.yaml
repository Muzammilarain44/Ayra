name: ayra
description: "Ayra — a free, on-device voice assistant for Android and Windows. No paid APIs, no cloud keys. Voice, rules and local tools only."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # On-device speech recognition (free, no API key)
  speech_to_text: ^7.0.0
  # On-device text-to-speech (free, no API key)
  flutter_tts: ^4.2.0
  # Open links, apps, dialer and SMS composer
  url_launcher: ^6.3.0
  # Local notes and memory storage
  shared_preferences: ^2.5.0
  # Battery level
  battery_plus: ^6.0.0
  # Torch / flashlight (Android)
  torch_light: ^1.0.0
  # Runtime permissions (microphone, etc.)
  permission_handler: ^12.0.0
  android_intent_plus: ^6.1.0
  volume_controller: ^3.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
